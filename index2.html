    <h1>横浜の観光地</h1>
    <div class="member1">
       <h2>山下公園</h2>
       <p>山下公園は横浜を代表する観光地の一つです。

        横浜港に面しており、美しい海の景色を楽しむことができます。

        園内には花壇やベンチがあり、散歩や休憩に最適です。

        夜にはライトアップされた港の景色を見ることができ、

        多くの観光客に人気があります。</p>
    </div>
    <div class="member2">  

    </div>

     <div class="member4">
        <h2>横浜みなとみらい</h2>
        <p>みなとみらいは近代的な高層ビルが集まる横浜の新しい観光エリアです。
        シンボル的な観覧車や赤レンガ倉庫、商業施設が並び、ショッピングや食事を楽しめます。
        夕暮れ時の海とビルのコントラストがとても美しく、夜景は全国的に有名です。
        家族連れやカップル、海外からの観光客でいつもにぎわっています。</p>
    </div>
