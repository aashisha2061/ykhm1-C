  <main>

    <section id="st-a" class="shock-card">
      <h2>歩道が狭い</h2>
      <p class="name">パク　ジュンヒョン</p>
      <p class="country">出身国：韓国</p>

      <div class="shock-content">
        <h3>言いたいことは？</h3>
        <p>
          歩道の幅をもっと広げてたらどうかなとも思う。
        </p>

        <h3>自分の国とどう違う？</h3>
        <p>
          二人くらいは余裕で通れる歩道がほとんどだった。
        </p>

        <h3>今はどう感じている？</h3>
        <p>
          ２人が横並びで歩くとギリギリぶつからないほどの幅の歩道が多いとおもうので、
          幅を少し広げたらいいんじゃないかなと思う。
        </p>
      </div>
    </section>
